[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-agent-registry-service"
version = "0.1.0"
description = "Independent control-plane Registry for A2A agents"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]>=1.0.3,<2",
  "cryptography>=44,<50",
  "httpx>=0.28.1,<1",
  "starlette>=0.46.2,<1",
  "uvicorn>=0.34.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
include = ["registry_service*"]

[tool.setuptools.package-data]
registry_service = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
