[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-a2a-gateway"
version = "0.3.0"
description = "Path-routed A2A data-plane Gateway for heterogeneous agents"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]>=1.0.3,<2",
  "aio-pika>=9.5,<10",
  "httpx>=0.28.1,<1",
  "starlette>=0.46.2,<1",
  "uvicorn>=0.34.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
include = ["a2a_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
